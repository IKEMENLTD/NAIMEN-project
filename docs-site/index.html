<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trinity System - イケメンの構造化</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --primary: #2563eb;
            --success: #16a34a;
            --warning: #ea580c;
            --background: #f8fafc;
            --surface: #ffffff;
            --text: #0f172a;
            --text-light: #475569;
            --border: #e2e8f0;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: var(--background);
            color: var(--text);
            line-height: 1.6;
        }
        
        header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 16px 0;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.95);
        }
        
        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .logo {
            font-size: 20px;
            font-weight: 700;
            color: var(--primary);
        }
        
        nav a {
            color: var(--text-light);
            text-decoration: none;
            margin-left: 24px;
            font-size: 14px;
            font-weight: 500;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 24px;
        }
        
        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 24px;
            margin-bottom: 40px;
        }
        
        .score-card {
            background: var(--surface);
            padding: 32px;
            border-radius: 12px;
            border: 1px solid var(--border);
            text-align: center;
        }
        
        .score-label {
            font-size: 14px;
            color: var(--text-light);
            margin-bottom: 12px;
            font-weight: 500;
        }
        
        .score-value {
            font-size: 48px;
            font-weight: 700;
            color: var(--primary);
        }
        
        .score-value.total {
            color: var(--success);
        }
        
        .main-content {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 32px;
        }
        
        .section {
            background: var(--surface);
            padding: 32px;
            border-radius: 12px;
            border: 1px solid var(--border);
        }
        
        .section h2 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 24px;
        }
        
        textarea, input {
            width: 100%;
            padding: 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
            resize: vertical;
        }
        
        textarea {
            min-height: 200px;
        }
        
        textarea:focus, input:focus {
            outline: none;
            border-color: var(--primary);
        }
        
        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
            margin-top: 16px;
            transition: opacity 0.2s;
        }
        
        button:hover {
            opacity: 0.9;
        }
        
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .task-item {
            padding: 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .task-item.completed {
            opacity: 0.6;
            text-decoration: line-through;
        }
        
        .task-actions button {
            padding: 6px 12px;
            font-size: 12px;
            margin-left: 8px;
        }
        
        .message {
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 14px;
        }
        
        .message.success {
            background: #dcfce7;
            color: #166534;
        }
        
        .message.error {
            background: #fee2e2;
            color: #991b1b;
        }
        
        .loading {
            text-align: center;
            padding: 20px;
            color: var(--text-light);
        }
        
        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
            
            .dashboard {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <div class="logo">Trinity System</div>
            <nav>
                <a href="docs.html">Documentation</a>
                <a href="https://github.com/IKEMENLTD/NAIMEN-project">GitHub</a>
            </nav>
        </div>
    </header>

    <div class="container">
        <div id="message-container"></div>
        
        <div class="dashboard">
            <div class="score-card">
                <div class="score-label">認識力</div>
                <div class="score-value" id="perception-score">-</div>
            </div>
            <div class="score-card">
                <div class="score-label">判断力</div>
                <div class="score-value" id="judgment-score">-</div>
            </div>
            <div class="score-card">
                <div class="score-label">実行力</div>
                <div class="score-value" id="execution-score">-</div>
            </div>
            <div class="score-card">
                <div class="score-label">総合スコア</div>
                <div class="score-value total" id="total-score">-</div>
            </div>
        </div>

        <div class="main-content">
            <div>
                <div class="section">
                    <h2>今日の日記</h2>
                    <textarea id="diary-input" placeholder="今日の出来事、考えたこと、感じたことを記録してください..."></textarea>
                    <button onclick="saveDiary()">保存して分析</button>
                </div>
                
                <div class="section" style="margin-top: 32px;">
                    <h2>判断を記録</h2>
                    <input type="text" id="decision-input" placeholder="今日の重要な判断..." style="margin-bottom: 16px;">
                    <textarea id="reasoning-input" placeholder="なぜその判断をしたか..." style="min-height: 100px;"></textarea>
                    <button onclick="saveDecision()">判断を記録</button>
                </div>
            </div>

            <div>
                <div class="section">
                    <h2>タスク管理</h2>
                    <input type="text" id="task-input" placeholder="新しいタスク...">
                    <button onclick="addTask()">追加</button>
                    <div id="task-list" style="margin-top: 24px;"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // API設定（環境に応じて変更）
        const API_URL = 'YOUR_GAS_API_URL_HERE';
        const USER_ID = 'uuid-001';
        
        // 初期化
        document.addEventListener('DOMContentLoaded', () => {
            loadScores();
            loadTasks();
        });
        
        // スコア取得
        async function loadScores() {
            if (API_URL === 'YOUR_GAS_API_URL_HERE') {
                document.getElementById('perception-score').textContent = '0';
                document.getElementById('judgment-score').textContent = '0';
                document.getElementById('execution-score').textContent = '0';
                document.getElementById('total-score').textContent = '0';
                showMessage('API URLを設定してください（index.htmlの23行目）', 'error');
                return;
            }
            
            try {
                const response = await fetch(`${API_URL}?path=user&user_id=${USER_ID}`);
                const data = await response.json();
                
                document.getElementById('perception-score').textContent = data.scores.perception;
                document.getElementById('judgment-score').textContent = data.scores.judgment;
                document.getElementById('execution-score').textContent = data.scores.execution;
                document.getElementById('total-score').textContent = data.scores.total;
            } catch (error) {
                console.error('Failed to load scores:', error);
            }
        }
        
        // 日記保存
        async function saveDiary() {
            const content = document.getElementById('diary-input').value;
            if (!content.trim()) {
                showMessage('日記を入力してください', 'error');
                return;
            }
            
            const today = new Date().toISOString().split('T')[0];
            
            // ローカルストレージに保存
            localStorage.setItem(`diary-${today}`, content);
            
            // 簡易分析
            const score = analyzeDiary(content);
            
            // APIに送信（実装されている場合）
            if (API_URL !== 'YOUR_GAS_API_URL_HERE') {
                try {
                    await fetch(`${API_URL}?path=event`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            user_id: USER_ID,
                            type: 'obs',
                            agent: 'observer',
                            dim: 'perception',
                            val: score,
                            data: { content: content }
                        })
                    });
                    
                    showMessage('日記を保存し、分析しました', 'success');
                    loadScores();
                } catch (error) {
                    showMessage('保存に失敗しました', 'error');
                }
            } else {
                showMessage('日記を保存しました（ローカル）', 'success');
            }
        }
        
        // 簡易日記分析
        function analyzeDiary(content) {
            const lines = content.split('\n').filter(l => l.trim());
            const factKeywords = ['した', 'だった', '言った', '起きた'];
            let factCount = 0;
            
            lines.forEach(line => {
                if (factKeywords.some(kw => line.includes(kw))) factCount++;
            });
            
            return Math.min(100, Math.round((factCount / lines.length) * 150));
        }
        
        // 判断記録
        async function saveDecision() {
            const decision = document.getElementById('decision-input').value;
            const reasoning = document.getElementById('reasoning-input').value;
            
            if (!decision.trim()) {
                showMessage('判断内容を入力してください', 'error');
                return;
            }
            
            const decisions = JSON.parse(localStorage.getItem('decisions') || '[]');
            decisions.push({
                content: decision,
                reasoning: reasoning,
                timestamp: new Date().toISOString()
            });
            localStorage.setItem('decisions', JSON.stringify(decisions));
            
            document.getElementById('decision-input').value = '';
            document.getElementById('reasoning-input').value = '';
            
            showMessage('判断を記録しました', 'success');
        }
        
        // タスク追加
        function addTask() {
            const taskInput = document.getElementById('task-input');
            const content = taskInput.value.trim();
            
            if (!content) return;
            
            const tasks = JSON.parse(localStorage.getItem('tasks') || '[]');
            tasks.push({
                id: Date.now(),
                content: content,
                completed: false,
                createdAt: new Date().toISOString()
            });
            localStorage.setItem('tasks', JSON.stringify(tasks));
            
            taskInput.value = '';
            loadTasks();
        }
        
        // タスク読み込み
        function loadTasks() {
            const tasks = JSON.parse(localStorage.getItem('tasks') || '[]');
            const taskList = document.getElementById('task-list');
            
            if (tasks.length === 0) {
                taskList.innerHTML = '<p style="color: var(--text-light); font-size: 14px;">タスクがありません</p>';
                return;
            }
            
            taskList.innerHTML = tasks.map(task => `
                <div class="task-item ${task.completed ? 'completed' : ''}">
                    <div>${task.content}</div>
                    <div class="task-actions">
                        ${!task.completed ? `<button onclick="completeTask(${task.id})">完了</button>` : ''}
                        <button onclick="deleteTask(${task.id})" style="background: #ef4444;">削除</button>
                    </div>
                </div>
            `).join('');
        }
        
        // タスク完了
        function completeTask(id) {
            const tasks = JSON.parse(localStorage.getItem('tasks') || '[]');
            const task = tasks.find(t => t.id === id);
            if (task) {
                task.completed = true;
                task.completedAt = new Date().toISOString();
                localStorage.setItem('tasks', JSON.stringify(tasks));
                loadTasks();
                showMessage('タスクを完了しました', 'success');
            }
        }
        
        // タスク削除
        function deleteTask(id) {
            const tasks = JSON.parse(localStorage.getItem('tasks') || '[]');
            const filtered = tasks.filter(t => t.id !== id);
            localStorage.setItem('tasks', JSON.stringify(filtered));
            loadTasks();
        }
        
        // メッセージ表示
        function showMessage(text, type = 'success') {
            const container = document.getElementById('message-container');
            const message = document.createElement('div');
            message.className = `message ${type}`;
            message.textContent = text;
            container.appendChild(message);
            
            setTimeout(() => message.remove(), 5000);
        }
    </script>
</body>
</html>
