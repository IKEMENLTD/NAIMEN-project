name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ikemen_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
        working-directory: ./ikemen-project/src
      
      - name: Run linter
        run: npm run lint
        working-directory: ./ikemen-project/src
      
      - name: Run unit tests
        run: npm run test:unit
        working-directory: ./ikemen-project/src
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ikemen_test
          REDIS_URL: redis://localhost:6379
      
      - name: Run integration tests
        run: npm run test:integration
        working-directory: ./ikemen-project/src
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ikemen_test
          REDIS_URL: redis://localhost:6379
      
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
        working-directory: ./ikemen-project/src
      
      - name: Run E2E tests
        run: npm run test:e2e
        working-directory: ./ikemen-project/src
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ikemen_test
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./ikemen-project/src/coverage/coverage-final.json
          flags: unittests
          name: codecov-umbrella
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: test-results
          path: ./ikemen-project/src/test-results/
          retention-days: 30

  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run npm audit
        run: npm audit --audit-level=moderate
        working-directory: ./ikemen-project/src
        continue-on-error: true
      
      - name: Run Snyk security scan
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high
        continue-on-error: true
